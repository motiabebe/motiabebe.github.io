<section id="video-section" class="bg-light text-dark py-5" data-theme="light">
    <div id="video-grid" class="container px-4 px-md-5 py-5">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-dark" role="status"></div>
        </div>
    </div>

    <!-- MUSTACHE TEMPLATE -->
    <template id="video-template">
        <div class="row align-items-center mb-5 gy-4 animate__animated animate__fadeIn">
            <div class="col-lg-12 text-center text-lg-start">
                <h2 class="display-5 fw-bold font-monospace text-dark">Video Production</h2>
                <p class="lead opacity-75 mb-4 text-dark" style="max-width: 800px;">Visual storytelling through dynamic editing and cinematic composition. From managing my own entertainment platforms to crafting high-retention content for global creators.</p>
                
                <div class="row g-3 justify-content-center justify-content-lg-start mt-2">
                    {{#channels}}
                    <div class="col-12 col-md-6 col-lg-5">
                        <div class="p-3 rounded-4 h-100 text-start shadow-sm bg-white" style="border: 1px solid rgba(0,0,0,0.05);">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <a href="{{url}}" target="_blank" class="text-dark text-decoration-none fw-bold d-flex align-items-center">
                                    <i class="fab fa-youtube text-danger me-2 fs-5"></i> {{name}}
                                </a>
                                <span class="badge bg-danger text-white px-2 py-1" style="font-size: 0.65rem;">{{stats}}</span>
                            </div>
                            <p class="small opacity-75 mb-0 text-dark" style="font-size: 0.8rem;">{{description}}</p>
                        </div>
                    </div>
                    {{/channels}}
                </div>
            </div>
        </div>

        {{#featured}}
        <div class="row mb-5 animate__animated animate__fadeInUp">
            <div class="col-12">
                <div class="p-1 rounded-4 shadow-lg" style="background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,1) 100%);">
                    <div class="bg-black rounded-4 overflow-hidden" style="border: 1px solid #222;">
                        <div class="row g-0 align-items-center">
                            <div class="col-lg-7 border-end border-dark">
                                <lite-youtube videoid="{{videoId}}" class="w-100" style="aspect-ratio: 16/9;"></lite-youtube>
                            </div>
                            <div class="col-lg-5 p-4 p-lg-5 text-center text-lg-start text-white">
                                <span class="badge bg-danger text-white mb-3 rounded-pill px-3 py-2 fw-normal"><i class="fas fa-star me-1"></i> Featured Reel</span>
                                <h3 class="fw-bold font-monospace text-white">{{title}}</h3>
                                <p class="small text-muted mb-3 font-monospace">{{channel}} • {{year}}</p>
                                <p class="opacity-75 small mb-4 px-3 px-lg-0 text-white" style="line-height: 1.6;">{{description}}</p>
                                <div class="d-flex flex-wrap justify-content-center justify-content-lg-start gap-2">
                                    {{#tags}}
                                    <span class="text-light opacity-50 font-monospace" style="font-size: 0.75rem;">#{{.}}</span>
                                    {{/tags}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {{/featured}}

        <div class="d-flex justify-content-center d-md-none mb-3">
            <span class="badge rounded-pill border border-dark text-dark opacity-50 fw-normal px-3 py-2 animate__animated animate__pulse animate__infinite">
                Swipe <i class="fas fa-arrow-right ms-1"></i>
            </span>
        </div>

        <h4 class="fw-bold font-monospace mb-4 text-center text-lg-start text-dark">More Projects</h4>
        <div class="row g-4 flex-nowrap flex-md-wrap overflow-x-auto mobile-scroll-track pb-3">
            {{#portfolio}}
            <div class="col-10 col-md-6 col-lg-4 scroll-snap-card animate__animated animate__fadeIn">
                <!-- Kept the cards dark to hold the video well, contrasting nicely with the light background -->
                <div class="video-item rounded-4 overflow-hidden shadow-lg h-100 d-flex flex-column position-relative" style="border: 1px solid #2a2a2a; background: #0a0a0a;">
                    {{#isPersonal}}
                        <span class="position-absolute top-0 end-0 badge bg-black text-white m-3 border border-secondary z-2 shadow" style="font-size: 0.65rem;">Personal</span>
                    {{/isPersonal}}
                    {{^isPersonal}}
                        <span class="position-absolute top-0 end-0 badge bg-black text-white m-3 border border-secondary z-2 shadow" style="font-size: 0.65rem;">Client: {{client}}</span>
                    {{/isPersonal}}

                    <lite-youtube videoid="{{videoId}}" class="w-100 border-bottom border-dark"></lite-youtube>
                    
                    <div class="p-4 d-flex flex-column flex-grow-1 text-center text-md-start text-white">
                        <div class="d-flex justify-content-center justify-content-md-between align-items-center mb-3 flex-wrap gap-2">
                            <span class="badge bg-light text-dark px-2 py-1 fw-normal">{{category}}</span>
                            <small class="text-muted font-monospace" style="font-size: 0.7rem;">{{year}}</small>
                        </div>
                        <h5 class="fw-bold mb-1 font-monospace text-white">{{title}}</h5>
                        <p class="small opacity-50 mb-3 font-monospace text-white" style="font-size: 0.75rem;">Role: {{role}}</p>
                        <p class="small opacity-75 mt-auto mb-0 text-white" style="line-height: 1.5;">{{description}}</p>
                    </div>
                </div>
            </div>
            {{/portfolio}}
        </div>
    </template>
</section>
