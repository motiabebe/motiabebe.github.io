<section id="video-section" class="bg-light text-dark py-5" data-theme="light">
    <div id="video-grid" class="container px-4 px-md-5 py-5">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-dark" role="status"></div>
        </div>
    </div>

    <template id="video-template">
        <div class="row align-items-center mb-5 gy-4">
            <div class="col-lg-12 text-center text-lg-start">
                <h2 class="display-5 fw-bold font-monospace typing-header">
                    <span class="observe-typed" data-typed-string="Video Production" data-typed-speed="50"></span>
                </h2>
                
                <p class="lead opacity-75 mb-4 text-dark observe-animate opacity-0" data-animate-class="animate__fadeInUp">
                    Visual storytelling through dynamic editing and cinematic composition. From managing my own entertainment platforms to collaborating with other channels, I continually seek new challenges to push my creative boundaries.
                </p>
                
                <div class="row g-3 justify-content-center justify-content-lg-start mt-2">
                    {{#channels}}
                    <div class="col-12 col-md-6 observe-animate opacity-0" data-animate-class="animate__fadeInUp">
                        <div class="p-3 rounded-4 h-100 text-start shadow-sm bg-white" style="border: 1px solid rgba(0,0,0,0.05);">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <a href="{{url}}" target="_blank" class="text-dark text-decoration-none fw-bold d-flex align-items-center">
                                    <i class="fab fa-youtube text-danger me-2 fs-5"></i> {{name}}
                                </a>
                                <span class="badge bg-danger text-white px-2 py-1" style="font-size: 0.65rem;">{{stats}}</span>
                            </div>
                            <p class="small opacity-75 mb-0 text-dark" style="font-size: 0.8rem;">{{description}}</p>
                        </div>
                    </div>
                    {{/channels}}
                </div>
            </div>
        </div>

        {{#featured}}
        <div class="row mb-5 observe-animate opacity-0 animate__delay-1s" data-animate-class="animate__fadeInUp">
            <div class="col-12">
                <div class="p-1 rounded-4 shadow-lg video-hero-card">
                    <div class="bg-black rounded-4 overflow-hidden border-dark-subtle border">
                        <div class="row g-0 align-items-center">
                            <div class="col-lg-7 border-end border-dark ratio-16x9">
                                <div class="lazy-video w-100" 
                                    data-videoid="{{videoId}}" 
                                    data-class="w-100" 
                                    data-style="aspect-ratio: 16/9;">
                                </div>
                            </div>
                            <div class="col-lg-5 p-4 p-lg-5 text-center text-lg-start text-white">
                                <span class="badge bg-danger text-white mb-3 rounded-pill px-3 py-2 fw-normal animate__animated animate__pulse animate__infinite"><i class="fas fa-star me-1"></i> Featured Video</span>
                                <h3 class="fw-bold font-monospace text-white">{{title}}</h3>
                                <p class="small text-light mb-3 font-monospace">{{channel}} • {{year}}</p>
                                <p class="opacity-75 small mb-4 px-3 px-lg-0 text-white lh-relaxed">{{description}}</p>
                                <div class="d-flex flex-wrap justify-content-center justify-content-lg-start gap-2">
                                    {{#tags}}
                                    <span class="text-light opacity-50 font-monospace" style="font-size: 0.75rem;">#{{.}}</span>
                                    {{/tags}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {{/featured}}

        <div class="d-flex justify-content-center d-md-none mb-4">
            <p class="small text-muted font-monospace opacity-75 text-center mb-0 animate__animated animate__pulse animate__infinite">
                <i class="fas fa-arrows-left-right me-2"></i>Swipe to explore
            </p>
        </div>

        <h4 class="fw-bold font-monospace mb-4 text-center text-lg-start text-dark">More Projects</h4>
        <div class="row g-4 flex-nowrap flex-md-wrap overflow-x-auto mobile-scroll-track pb-3">
            {{#portfolio}}
            <div class="col-10 col-md-6 col-lg-4 scroll-snap-card observe-animate opacity-0" data-animate-class="animate__fadeInUp">
                <div class="video-item rounded-4 overflow-hidden shadow-lg h-100 d-flex flex-column position-relative" style="border: 1px solid #2a2a2a; background: #0a0a0a;">
                    
                    {{#isPersonal}}
                        <span class="position-absolute top-0 end-0 badge bg-black text-white m-3 border border-secondary z-2 shadow" style="font-size: 0.65rem;">Personal</span>
                    {{/isPersonal}}
                    {{^isPersonal}}
                        <span class="position-absolute top-0 end-0 badge bg-black text-white m-3 border border-secondary z-2 shadow text-wrap text-end badge-lh max-w-85" style="font-size: 0.65rem;">Client: {{client}}</span>
                    {{/isPersonal}}

                    <div class="lazy-video w-100 border-bottom border-dark" 
                        data-videoid="{{videoId}}" 
                        data-class="w-100 border-bottom border-dark">
                    </div>
                    
                    <div class="p-4 d-flex flex-column flex-grow-1 text-center text-md-start text-white">
                        <div class="d-flex justify-content-center justify-content-md-between align-items-center mb-3 flex-wrap gap-2">
                            <small class="text-light font-monospace" style="font-size: 0.7rem;">{{year}}</small>
                        </div>
                        <h5 class="fw-bold mb-1 font-monospace text-white">{{title}}</h5>
                        <p class="small opacity-50 mb-3 font-monospace text-white" style="font-size: 0.75rem;">Role: {{role}}</p>
                        <p class="small opacity-75 mt-auto mb-0 text-white" style="line-height: 1.5;">{{description}}</p>
                    </div>
                </div>
            </div>
            {{/portfolio}}
        </div>
    </template>
</section>
