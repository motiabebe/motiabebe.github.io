<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moti Abebe | CS Graduate & Creator</title>
    
    <!-- Fonts: Space Mono (Headings/Terminal) & Inter (Body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Plugins -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />    
    
    <!-- Lite YouTube Embed CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lite-youtube-embed/0.3.2/lite-yt-embed.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="img/My Logo white.png" type="image/x-icon">
</head>
<body class="bg-black text-light transition-theme" id="body-container">
<!-- <body class="bg-light text-black transition-theme" id="body-container"> -->
    

    <!-- Navbar injected here (optional decoupling) -->
    <div hx-get="partials/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <section id="intro" class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center text-center">

        <p id="greetingText" class="display-6 d-none mb-0">Hi, I'm</p>

        <div class="intro-overlap-wrapper w-100 my-3">
            <div id="terminal-container" class="fs-4 font-monospace opacity-0 transition-fade">
                <div id="terminal-line" class="text-start d-inline-block"></div>
            </div>
            <h1 id="final-name-container" class="display-1 fw-bold opacity-0 transition-fade m-0">
                <span id="typed-name"></span>
            </h1>
            
        </div>

        <div id="intro-actions" class="opacity-0 transition-fade mt-3">
            <p class="lead mb-3">Welcome to my portfolio</p>
            <a href="#about" class="text-decoration-none text-reset fs-5 fw-bold d-flex flex-column align-items-center">
                Get Started
                <i class="fas fa-angles-down mt-4 animate__animated animate__bounce animate__slower animate__repeat-3"></i>
            </a>
        </div>
    </section>

    <main id="home" class="container-fluid p-0">
        <div hx-get="partials/about.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <div id="works-section" hx-get="partials/works.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <div id="photography-section" hx-get="partials/photography.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <div id="design-section" hx-get="partials/design.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <div id="video-section" hx-get="partials/video.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <div id="music-section" hx-get="partials/music.html" hx-trigger="load" hx-swap="outerHTML"></div>
    </main>

    <div hx-get="partials/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <!-- Libraries -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://unpkg.com/mustache@4.2.0"></script>
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <script src="js/vendor/vanilla-tilt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lite-youtube-embed/0.3.2/lite-yt-embed.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS Modules -->
    <script src="js/main.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/render.js"></script>
</body>
</html>
